services:
  agent-service:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8001}
      SERVER_RELOAD: ${SERVER_RELOAD:-false}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/api/v1}
      DATA_DIR: ${DATA_DIR:-data/ml-latest-small-filtered}
      SEARCH_MAX_FEATURES: ${SEARCH_MAX_FEATURES:-30000}
      SEARCH_CANDIDATE_POOL: ${SEARCH_CANDIDATE_POOL:-100}
      RECOMMENDATION_NEIGHBOR_COUNT: ${RECOMMENDATION_NEIGHBOR_COUNT:-30}
      RECOMMENDATION_MINIMUM_OVERLAP: ${RECOMMENDATION_MINIMUM_OVERLAP:-3}
      RECOMMENDATION_OVERLAP_SHRINKAGE: ${RECOMMENDATION_OVERLAP_SHRINKAGE:-10}
      RECOMMENDATION_PREDICTION_SHRINKAGE: ${RECOMMENDATION_PREDICTION_SHRINKAGE:-5}
      RECOMMENDATION_DEFAULT_TOP_K: ${RECOMMENDATION_DEFAULT_TOP_K:-5}
      RECOMMENDATION_QUERY_WEIGHT: ${RECOMMENDATION_QUERY_WEIGHT:-0.45}
      RECOMMENDATION_PROFILE_WEIGHT: ${RECOMMENDATION_PROFILE_WEIGHT:-0.20}
      RECOMMENDATION_COLLABORATIVE_WEIGHT: ${RECOMMENDATION_COLLABORATIVE_WEIGHT:-0.20}
      RECOMMENDATION_QUALITY_WEIGHT: ${RECOMMENDATION_QUALITY_WEIGHT:-0.15}
      RECOMMENDATION_GENERAL_PROFILE_WEIGHT: ${RECOMMENDATION_GENERAL_PROFILE_WEIGHT:-0.20}
      RECOMMENDATION_GENERAL_COLLABORATIVE_WEIGHT: ${RECOMMENDATION_GENERAL_COLLABORATIVE_WEIGHT:-0.50}
      RECOMMENDATION_GENERAL_QUALITY_WEIGHT: ${RECOMMENDATION_GENERAL_QUALITY_WEIGHT:-0.30}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8001:8001"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      UI_API_BASE_URL: http://agent-service:8001
      UI_API_TIMEOUT_SECONDS: ${UI_API_TIMEOUT_SECONDS:-120}
    ports:
      - "8501:8501"
    depends_on:
      - agent-service
