services:
  agent-service:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    env_file: .env
    ports:
      - "8001:8001"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    env_file: .env
    environment:
      # Override: inside Docker the UI reaches the backend via service name.
      UI_API_BASE_URL: http://agent-service:8001
    ports:
      - "8501:8501"
    depends_on:
      - agent-service
